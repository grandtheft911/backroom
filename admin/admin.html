<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backroom Admin</title>
<style>
  :root { --bg:#f4f4f2; --card:#fff; --line:#e4e4df; --strong:#cfcfc8; --text:#1a1a1a; --soft:#55554f; --muted:#8c8c86; --danger:#b42318; --ok:#3d5a35; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 36px 24px 60px; }
  header { display:flex; justify-content:space-between; align-items:flex-end; border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:24px; }
  h1 { margin:0; font-size:22px; letter-spacing:-.4px; font-weight:650; }
  h1 span { color:var(--muted); font-weight:450; }
  header a { color:var(--soft); font-size:13px; }
  .cols { display:grid; grid-template-columns: 1fr 1.15fr; gap: 24px; align-items:start; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  h2 { margin:0 0 14px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:600; }
  .row { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:none; }
  .row img { width:44px; height:44px; border-radius:11px; object-fit:cover; background:var(--line); flex:none; }
  .row .t { flex:1; min-width:0; }
  .row .n { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .m { color:var(--muted); font-size:12.5px; }
  .row.sel { background:#f7f7f4; margin:0 -20px; padding:10px 20px; }
  .empty { color:var(--muted); padding:8px 0; }
  label { display:block; font-size:12.5px; font-weight:600; color:var(--soft); margin:14px 0 6px; }
  label small { font-weight:400; color:var(--muted); }
  input[type=text], textarea { width:100%; font:inherit; padding:9px 11px; border:1px solid var(--strong); border-radius:9px; background:#fff; color:var(--text); }
  input[type=text]:focus, textarea:focus { outline:2px solid #1a1a1a22; border-color:var(--text); }
  textarea { min-height:76px; resize:vertical; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .iconpick { display:flex; gap:14px; align-items:center; }
  .iconpick .prev { width:76px; height:76px; border-radius:18px; background:var(--bg); border:1px dashed var(--strong); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; overflow:hidden; flex:none; }
  .iconpick .prev img { width:100%; height:100%; object-fit:cover; }
  .drop { border:1px dashed var(--strong); border-radius:10px; padding:14px; color:var(--soft); text-align:center; cursor:pointer; }
  .drop.has { border-style:solid; color:var(--text); text-align:left; }
  .drop.over { border-color:var(--text); background:#fafaf8; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:38px; padding:0 14px; border-radius:9px; border:1px solid var(--strong); background:#fff; color:var(--text); font:inherit; font-weight:600; font-size:13.5px; cursor:pointer; }
  .btn:hover { border-color:var(--text); }
  .btn.primary { background:#1a1a1a; border-color:#1a1a1a; color:#fff; }
  .btn.danger { color:var(--danger); }
  .btn.sm { min-height:30px; padding:0 10px; font-size:12.5px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .actions { display:flex; gap:10px; margin-top:20px; align-items:center; }
  .status { margin-top:14px; font-size:13px; color:var(--soft); min-height:20px; }
  .status.err { color:var(--danger); }
  .status.ok { color:var(--ok); }
  .bar { height:4px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:10px; display:none; }
  .bar i { display:block; height:100%; width:0; background:#1a1a1a; transition:width .2s; }
  .bar.ind i { width:30%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform:translateX(-100%); } to { transform:translateX(340%); } }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Backroom <span>Admin</span></h1>
    <a id="site" target="_blank" rel="noopener">Deschide site-ul ↗</a>
  </header>

  <div class="cols">
    <section class="panel">
      <h2>Jocuri publicate</h2>
      <div id="games"><div class="empty">Se încarcă…</div></div>
    </section>

    <section class="panel">
      <h2 id="formTitle">Joc nou</h2>
      <form id="form" autocomplete="off">
        <div class="iconpick">
          <div class="prev" id="iconPrev">Iconiță</div>
          <div>
            <button type="button" class="btn" id="iconBtn">Alege iconița</button>
            <div style="color:var(--muted);font-size:12px;margin-top:6px">PNG sau JPG, pătrată. Se decupează automat la 512×512.</div>
          </div>
          <input type="file" id="iconFile" accept="image/png,image/jpeg,image/webp">
        </div>

        <label>Nume</label>
        <input type="text" id="name" maxlength="60" required>

        <label>Descriere <small>— 1–2 propoziții, apare în listă</small></label>
        <textarea id="description" maxlength="600"></textarea>

        <div class="two">
          <div><label>Versiune</label><input type="text" id="version" placeholder="1.0" maxlength="20" required></div>
          <div><label>Android minim <small>(opțional)</small></label><input type="text" id="minAndroid" placeholder="8.0" maxlength="10"></div>
        </div>

        <label>Ce e nou <small>(opțional)</small></label>
        <textarea id="changelog" maxlength="2000"></textarea>

        <label>Fișier APK <small id="apkHint"></small></label>
        <div class="drop" id="drop">Trage APK-ul aici sau apasă ca să-l alegi</div>
        <input type="file" id="apkFile" accept=".apk,application/vnd.android.package-archive">

        <div class="actions">
          <button type="submit" class="btn primary" id="submit">Publică</button>
          <button type="button" class="btn" id="cancel" hidden>Anulează editarea</button>
        </div>
        <div class="bar" id="bar"><i></i></div>
        <div class="status" id="status"></div>
      </form>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let games = [], editing = null, iconData = null, apk = null, working = false;

const mb = (b) => (b / 1048576).toFixed(1).replace(".", ",") + " MB";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]);

function status(msg, kind = "") { const s = $("status"); s.textContent = msg; s.className = "status " + kind; }
function bar(mode, pct) {
  const b = $("bar"); b.style.display = mode ? "block" : "none";
  b.classList.toggle("ind", mode === "ind");
  b.firstElementChild.style.width = mode === "pct" ? pct + "%" : "";
}

async function load() {
  const r = await fetch("/api/games"); const d = await r.json();
  games = (d.games || []).sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  $("site").href = d.site;
  render();
}

function render() {
  const el = $("games");
  if (!games.length) { el.innerHTML = '<div class="empty">Niciun joc încă. Adaugă primul din formular.</div>'; return; }
  el.innerHTML = games.map((g) => `
    <div class="row ${editing && editing.id === g.id ? "sel" : ""}">
      <img src="/${esc(g.icon)}" alt="">
      <div class="t"><div class="n">${esc(g.name)}</div><div class="m">v${esc(g.version)} · ${mb(g.size || 0)} · ${esc(g.updated)}</div></div>
      <button class="btn sm" data-edit="${esc(g.id)}">Editează</button>
      <button class="btn sm danger" data-del="${esc(g.id)}">Șterge</button>
    </div>`).join("");
}

$("games").addEventListener("click", async (e) => {
  const ed = e.target.dataset.edit, del = e.target.dataset.del;
  if (ed) startEdit(games.find((g) => g.id === ed));
  if (del && !working) {
    const g = games.find((x) => x.id === del);
    if (!e.target.dataset.confirm) { e.target.dataset.confirm = 1; e.target.textContent = "Sigur?"; return; }
    working = true; status(`Se șterge ${g.name}…`); bar("ind");
    const r = await fetch("/api/delete", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: del }) });
    const d = await r.json(); working = false; bar();
    if (!r.ok) return status(d.error, "err");
    if (editing && editing.id === del) resetForm();
    status(`${g.name} a fost șters. Site-ul se actualizează în ~1 minut.`, "ok");
    load();
  }
});

function startEdit(g) {
  editing = g; iconData = null; apk = null;
  $("formTitle").textContent = "Editează · " + g.name;
  $("name").value = g.name; $("description").value = g.description || ""; $("version").value = g.version;
  $("minAndroid").value = g.minAndroid || ""; $("changelog").value = g.changelog || "";
  $("iconPrev").innerHTML = `<img src="/${esc(g.icon)}">`;
  $("drop").textContent = "Păstrează APK-ul actual, sau trage aici o versiune nouă"; $("drop").className = "drop";
  $("apkHint").textContent = "(opțional la editare)";
  $("cancel").hidden = false; $("submit").textContent = "Salvează";
  status(""); render(); window.scrollTo({ top: 0, behavior: "smooth" });
}

function resetForm() {
  editing = null; iconData = null; apk = null; $("form").reset();
  $("formTitle").textContent = "Joc nou"; $("iconPrev").textContent = "Iconiță";
  $("drop").textContent = "Trage APK-ul aici sau apasă ca să-l alegi"; $("drop").className = "drop";
  $("apkHint").textContent = ""; $("cancel").hidden = true; $("submit").textContent = "Publică"; render();
}
$("cancel").onclick = () => { resetForm(); status(""); };

$("iconBtn").onclick = () => $("iconFile").click();
$("iconPrev").onclick = () => $("iconFile").click();
$("iconFile").onchange = (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = 512;
    const s = Math.min(img.width, img.height);
    c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 512, 512);
    iconData = c.toDataURL("image/png");
    $("iconPrev").innerHTML = `<img src="${iconData}">`;
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(f);
};

function setApk(f) {
  if (!f) return;
  if (!/\.apk$/i.test(f.name)) return status("Fișierul trebuie să fie .apk", "err");
  apk = f; $("drop").className = "drop has"; $("drop").textContent = `${f.name} · ${mb(f.size)}`; status("");
}
$("drop").onclick = () => $("apkFile").click();
$("apkFile").onchange = (e) => setApk(e.target.files[0]);
["dragover", "dragenter"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, () => $("drop").classList.remove("over")));
$("drop").addEventListener("drop", (e) => { e.preventDefault(); setApk(e.dataTransfer.files[0]); });

function uploadApk(file) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/apk");
    x.upload.onprogress = (e) => e.lengthComputable && bar("pct", (e.loaded / e.total) * 100);
    x.onload = () => x.status === 200 ? resolve(JSON.parse(x.responseText).tmp) : reject(new Error("Copierea APK-ului a eșuat."));
    x.onerror = () => reject(new Error("Copierea APK-ului a eșuat."));
    x.send(file);
  });
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  if (working) return;
  if (!editing && !iconData) return status("Alege o iconiță.", "err");
  if (!editing && !apk) return status("Alege fișierul APK.", "err");
  working = true; $("submit").disabled = true;
  try {
    let apkTmp = null;
    if (apk) { status("Se pregătește APK-ul…"); apkTmp = await uploadApk(apk); }
    status(apk ? `Se urcă pe GitHub (${mb(apk.size)})… poate dura câteva minute.` : "Se salvează…");
    bar("ind");
    const r = await fetch("/api/publish", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: editing && editing.id, name: $("name").value, description: $("description").value,
        version: $("version").value, minAndroid: $("minAndroid").value, changelog: $("changelog").value,
        icon: iconData, apkTmp,
      }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    const name = d.name;
    resetForm();
    status(`${name} e publicat. Apare pe site în ~1 minut.`, "ok");
    load();
  } catch (err) { status(err.message, "err"); }
  finally { working = false; $("submit").disabled = false; bar(); }
};

load();
</script>
</body>
</html>
